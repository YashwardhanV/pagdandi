# Pagdandi v2 services. Three containers, no database:
#   gh     GraphHopper serving data/build/gh (built by `make data`)
#   api    Go API (trails, wander, search, tiles)
#   caddy  TLS, the built web app, reverse proxy to the API (prod profile)
#
#   dev:  docker compose -f infra/docker-compose.yml up -d gh        (then `make dev` runs api + web natively)
#   prod: docker compose -f infra/docker-compose.yml --profile prod up -d --build
name: pagdandi

services:
  gh:
    build: ./graphhopper
    restart: unless-stopped
    environment:
      GH_CONFIG: /data/build/gh/config.yml
      GH_SERVE_XMX: ${GH_SERVE_XMX:-2g}
      GH_BIND: 0.0.0.0
      HOST_DATA_DIR: ${PAGDANDI_HOST_DATA:-/opt/pagdandi/data}
    ports: ["127.0.0.1:8989:8989"]
    volumes: ["../data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8989/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  api:
    build:
      context: ../services/api
    profiles: [prod]
    restart: unless-stopped
    env_file: [../.env]
    environment:
      APP_ENV: prod
      GH_URL: http://gh:8989
      DATA_DIR: /data/build
      REGION_FILE: /data/region.yaml
      CORS_ORIGINS: https://${DOMAIN:-localhost}
    volumes: ["../data:/data:ro"]
    depends_on:
      gh: {condition: service_healthy}

  caddy:
    image: caddy:2.9-alpine
    profiles: [prod]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/web/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  caddy_data:
  caddy_config:

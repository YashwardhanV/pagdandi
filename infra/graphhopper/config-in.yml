# GraphHopper 11.1 config for the India two-wheeler graph (SPEC §6.1).
# `datactl graph --country in` renders this template into data/build/gh/in/config.yml,
# replacing the {{...}} placeholders. Every profile also loads military.json, the
# generated military-area blocks from `datactl areas` (SPEC §4.3, §6.2).
graphhopper:
  datareader.file: "{{DATAREADER_FILE}}"
  graph.location: "{{GRAPH_LOCATION}}"
  custom_models.directory: "{{MODELS_DIR}}"

  profiles:
    - name: tw_standard
      custom_model_files: [tw_standard.json, military.json]
    - name: tw_shortcut
      custom_model_files: [tw_shortcut.json, military.json]
    - name: tw_shortcut_night
      custom_model_files: [tw_shortcut_night.json, military.json]
    - name: tw_adventure
      custom_model_files: [tw_adventure.json, military.json]

  # LM (landmarks) for every profile so the API can add per-request season
  # penalties, which only ever increase weights (SPEC §6.1).
  profiles_ch: []
  profiles_lm:
    - profile: tw_standard
    - profile: tw_shortcut
    - profile: tw_shortcut_night
    - profile: tw_adventure
  prepare.lm.landmarks: 16
  prepare.lm.threads: 2

  graph.encoded_values: urban_density, car_access, car_average_speed, road_access, road_class, road_class_link, road_environment, roundabout, surface, smoothness, track_type, max_speed, osm_way_id
  # Urban density lets city roads run at realistic two-wheeler speeds (docs/DECISIONS.md).
  graph.urban_density.threads: 2
  prepare.min_network_size: {{MIN_NETWORK_SIZE}}
  prepare.subnetworks.threads: 2
  routing.snap_preventions_default: tunnel, bridge, ferry
  routing.non_ch.max_waypoint_distance: 1000000
  routing.max_visited_nodes: 2000000
  # Two-wheelers never use foot-only ways.
  import.osm.ignored_highways: footway,cycleway,path,steps,pedestrian,bridleway,corridor,platform,construction,proposed
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: {{PORT}}
      bind_host: {{BIND}}
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: {{ADMIN_PORT}}
      bind_host: localhost

logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

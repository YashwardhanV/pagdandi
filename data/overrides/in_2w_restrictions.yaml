# Two-wheeler restrictions for India (SPEC §4.3).
# `datactl overrides --country in` resolves each entry to OSM way IDs (name regex + bbox + highway filter)
# and injects motor_vehicle=no into those ways in the India extract.
# Every entry is `verify: true`: rules change, re-check them against current notifications.
# bbox is [min_lng, min_lat, max_lng, max_lat].
restrictions:
  - id: mumbai_pune_expressway
    name: Mumbai–Pune Expressway
    name_patterns: ["mumbai.?pune expressway", "yashwantrao chavan", "mumbai.?pune express ?way"]
    highways: [motorway, trunk]
    bbox: [73.00, 18.55, 73.85, 19.05]
    verify: true
  - id: bandra_worli_sea_link
    name: Bandra–Worli Sea Link
    name_patterns: ["bandra.?worli", "rajiv gandhi sea link", "sea link"]
    highways: [motorway, trunk, primary]
    bbox: [72.80, 19.00, 72.835, 19.05]
    verify: true
  - id: atal_setu
    name: Atal Setu (Mumbai Trans Harbour Link)
    name_patterns: ["atal setu", "trans.?harbour link", "sewri.?nhava sheva"]
    highways: [motorway, trunk, primary]
    bbox: [72.84, 18.88, 73.02, 19.01]
    verify: true
  - id: bengaluru_mysuru_expressway
    name: Bengaluru–Mysuru Expressway (main carriageway)
    name_patterns: ["bengaluru.?mysuru", "bangalore.?mysore", "bengaluru.?mysore", "mysuru.?bengaluru"]
    highways: [motorway, trunk]   # service roads are tagged differently and stay open
    bbox: [76.60, 12.25, 77.55, 12.95]
    verify: true
  - id: delhi_meerut_expressway
    name: Delhi–Meerut Expressway (expressway lanes)
    name_patterns: ["delhi.?meerut expressway", "delhi.?meerut express ?way"]
    highways: [motorway]
    bbox: [77.25, 28.55, 77.75, 29.02]
    verify: true
  - id: eastern_peripheral_expressway
    name: Eastern Peripheral Expressway
    name_patterns: ["eastern peripheral", "kundli.?ghaziabad.?palwal"]
    highways: [motorway, trunk]
    bbox: [76.95, 28.10, 77.60, 28.95]
    verify: true
  - id: western_peripheral_expressway
    name: Western Peripheral (KMP) Expressway
    name_patterns: ["western peripheral", "kundli.?manesar.?palwal", "kmp expressway"]
    highways: [motorway, trunk]
    bbox: [76.75, 28.05, 77.35, 28.90]
    verify: true
  - id: hyderabad_orr
    name: Hyderabad Outer Ring Road (main carriageway)
    name_patterns: ["outer ring road", "nehru outer ring road", "^orr$"]
    highways: [motorway, trunk]
    bbox: [78.20, 17.20, 78.75, 17.65]
    verify: true

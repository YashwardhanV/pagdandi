# CI: Go vet/format/tests (fake GraphHopper, no map data needed), web typecheck/tests/build.
name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: services/api/go.mod, cache-dependency-path: services/api/go.sum}
      - name: vet, format, test
        working-directory: services/api
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
          go vet ./...
          go test ./...
          go build ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - name: typecheck, test, build
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build
